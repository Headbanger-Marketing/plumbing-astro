# Archival cloud-build fallback. Routine builds run on the Mac via scripts/local-deploy.py.
# Keep manual dispatch for an explicit rollback; source pushes do not run this workflow.
name: Deploy site

on:
  workflow_dispatch:
    inputs:
      site:
        description: Domain, comma-separated domain list, or "all"
        required: true
        type: string
      chat_only:
        description: Connect chat to an exact reviewed domain list without rebuilding pages
        type: boolean
        default: false

concurrency:
  group: deploy-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          SITE_IN: ${{ inputs.site }}
          CHAT_ONLY: ${{ inputs.chat_only }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$CHAT_ONLY" = "true" ]; then
              python3 scripts/rollout-chat.py --select "$SITE_IN" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            SITE="${SITE_IN// /}"
            if [ "$SITE" = "all" ]; then
              echo "list=$(printf '%s\n' src/sites/*.ts | xargs -n1 basename | sed 's/\.ts$//' | sort -u | jq -Rsc 'split("\n")|map(select(length>0))')" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ -z "$SITE" || "$SITE" == *, || "$SITE" == ,* || "$SITE" == *,,* ]]; then
              echo "Supply an explicit domain or comma-separated domains, without empty entries." >&2
              exit 1
            fi
            IFS=',' read -ra domains <<< "$SITE"
            for domain in "${domains[@]}"; do
              if [[ ! "$domain" =~ ^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}$ ]] || [[ "$domain" == *..* ]] || [ ! -f "src/sites/${domain}.ts" ]; then
                echo "Unknown or invalid site selection: $domain" >&2
                exit 1
              fi
            done
            echo "list=$(printf '%s\n' "${domains[@]}" | sort -u | jq -Rsc 'split("\n")|map(select(length>0))')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t files < <(git diff --name-only HEAD~1 HEAD -- 'src/sites/**' || true)
          domains=()
          for f in "${files[@]:-}"; do
            d="${f#src/sites/}"
            d="${d%%/*}"
            d="${d%.ts}"
            [ -f "src/sites/${d}.ts" ] || continue
            domains+=("$d")
          done
          if [ "${#domains[@]}" -eq 0 ]; then
            echo "list=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "list=$(printf '%s\n' "${domains[@]}" | sort -u | jq -Rsc 'split("\n")|map(select(length>0))')" >> "$GITHUB_OUTPUT"

  deploy:
    needs: pick
    if: needs.pick.outputs.list != '[]' && inputs.chat_only != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        site: ${{ fromJson(needs.pick.outputs.list) }}
    concurrency:
      group: pages-${{ matrix.site }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Attach HVAC photo pool
        if: github.repository == 'Headbanger-Marketing/hvac-astro'
        run: |
          set -euo pipefail
          rm -f public/assets/img
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/Headbanger-Marketing/londonheatingcooling.ca.git /tmp/img-src
          git -C /tmp/img-src sparse-checkout set assets/img
          ln -s /tmp/img-src/assets/img public/assets/img
          test -e public/assets/img/hero.webp || test -d public/assets/img/logos

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet beautifulsoup4
      - run: npm ci

      - name: Build ${{ matrix.site }}
        env:
          HVAC_SITE: ${{ matrix.site }}
        run: |
          set -euo pipefail
          test -f "src/sites/${HVAC_SITE}.ts"
          npm run build
          python3 scripts/normalize.py
          python3 scripts/gen-service-redirects.py
          node scripts/gen-og-images.mjs "$HVAC_SITE" || echo "OG GEN FAIL (non-fatal)"

      - name: Push to Pages repo
        env:
          PAGES_DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          HVAC_SITE: ${{ matrix.site }}
        run: |
          if [ -z "$PAGES_DEPLOY_TOKEN" ]; then
            echo "Missing repo secret PAGES_DEPLOY_TOKEN (needs contents:write on Headbanger-Marketing Pages repos)." >&2
            exit 1
          fi
          chmod +x scripts/ci-push-pages.sh
          ./scripts/ci-push-pages.sh "$HVAC_SITE"

  deploy-chat:
    needs: pick
    if: github.event_name == 'workflow_dispatch' && inputs.chat_only == true && needs.pick.outputs.list != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        site: ${{ fromJson(needs.pick.outputs.list) }}
    concurrency:
      group: pages-${{ matrix.site }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Headbanger-Marketing/${{ matrix.site }}
          ref: main
          path: published
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Connect chat without changing the published presentation
        env:
          HVAC_SITE: ${{ matrix.site }}
        run: python3 scripts/rollout-chat.py --root published --site "$HVAC_SITE"
      - name: Push only changed published HTML
        run: |
          set -euo pipefail
          git -C published config user.name "github-actions[bot]"
          git -C published config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C published add -- '*.html'
          if git -C published diff --cached --quiet; then
            echo "Chat connection already current."
            exit 0
          fi
          git -C published diff --cached --name-only | python3 -c 'import sys; paths = sys.stdin.read().splitlines(); assert paths and all(path.endswith(".html") for path in paths), "Only published HTML may change"'
          git -C published commit -qm "chat: connect company assistant"
          git -C published push origin main
